<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Primary meta -->
        <title>Pika | Tiny Cat Photo Booth</title>
        <meta
            name="description"
            content="A cute photo booth in your browser. A tiny cat counts you down, you pick a frame, and share your strip. Photos never leave your device."
        />
        <meta
            name="keywords"
            content="photo booth, photobooth, selfie, collage, camera app, online photo booth, pika, PWA"
        />
        <meta name="author" content="Rahul Sharma" />
        <meta name="robots" content="index, follow" />
        <meta name="theme-color" content="#fff4f8" />

        <!-- Mobile web app -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Pika" />

        <!-- Canonical -->
        <link rel="canonical" href="https://pika.rahulsharma.app/" />

        <!-- Favicon / Icons -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <!-- Preconnect for Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:site_name" content="Pika" />
        <meta property="og:title" content="Pika: a tiny cat photo booth" />
        <meta
            property="og:description"
            content="A tiny cat counts you down, you pick a cute frame, and share your photo strip. Free, in your browser, photos never leave your device."
        />
        <meta property="og:url" content="https://pika.rahulsharma.app/" />
        <meta
            property="og:image"
            content="https://pika.rahulsharma.app/preview.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Pika: a ginger cat sitting on a photo booth strip"
        />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@rahulsharma" />
        <meta name="twitter:title" content="Pika: a tiny cat photo booth" />
        <meta
            name="twitter:description"
            content="Capture selfies, pick a frame theme, apply effects, and download your photo collage. Runs right in your browser."
        />
        <meta
            name="twitter:image"
            content="https://pika.rahulsharma.app/preview.png"
        />
        <meta
            name="twitter:image:alt"
            content="Pika: a ginger cat sitting on a photo booth strip"
        />

        <!-- Structured Data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "Pika",
                "url": "https://pika.rahulsharma.app/",
                "description": "A cute, modern photo booth web app. Capture selfies, apply frame themes and effects, and download your collage.",
                "applicationCategory": "MultimediaApplication",
                "operatingSystem": "Any",
                "browserRequirements": "Requires a modern browser with camera access.",
                "offers": {
                    "@type": "Offer",
                    "price": "0",
                    "priceCurrency": "USD"
                },
                "author": {
                    "@type": "Person",
                    "name": "Rahul Sharma",
                    "url": "https://rahulsharma.me"
                }
            }
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
